<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Syauqi Zamzami Rahman</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            text-align: center;
        }

        .foto {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #3498db;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px;
            color: #2c3e50;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .biodata {
            text-align: left;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        .row {
            display: flex;
            padding: 12px 5px;
            border-bottom: 1px solid #eee;
        }

        .label {
            width: 130px;
            font-weight: bold;
            color: #3498db;
        }

        .value {
            flex: 1;
        }

        footer {
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .row {
                display: block;
            }
            .label {
                width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
